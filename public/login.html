<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#3d5a80">
  <title>Sign in · Wishlist → Wealth</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/auth.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
</head>
<body class="auth-page" data-auth-mode="login">
  <div class="auth-shell">
    <aside class="auth-brand">
      <p class="auth-brand__eyebrow">Wishlist → Wealth</p>
      <h1>Welcome back</h1>
      <p>Your wishlist, projections, and consideration timers — all in one place.</p>
    </aside>
    <main class="auth-panel">
      <h2>Sign in</h2>
      <form id="auth-form" class="auth-form" novalidate>
        <div id="auth-error" class="auth-error" hidden></div>
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" autocomplete="username" required minlength="3" maxlength="32" pattern="[a-zA-Z0-9_]+">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" required minlength="8">
        </div>
        <button type="submit" class="btn btn--primary" id="auth-submit">Sign in</button>
      </form>
      <p class="auth-switch">No account? <a href="/register">Create one</a></p>
    </main>
  </div>
  <script type="module" src="/js/auth-page.js"></script>
</body>
</html>
